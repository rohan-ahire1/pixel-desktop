<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>DOS game</title>
<!-- Runs one DOS game with js-dos (DOSBox in WebAssembly). Opened inside a PixelOS window as ?g=<bundle name>.
     Closing the window removes this page, which stops the emulator. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="jsdos/js-dos.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  #dos { position: absolute; inset: 0; }
  #pad { position: absolute; inset: auto 0 0 0; display: none; justify-content: space-between; align-items: flex-end; padding: 10px; pointer-events: none; z-index: 10; }
  body.touch #pad { display: flex; }
  .grp { display: grid; gap: 6px; pointer-events: auto; }
  .dpad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); }
  .acts { grid-template-columns: repeat(2, 64px); }
  .k { font: 700 12px/1 ui-monospace, Menlo, monospace; color: #fff; background: rgba(255, 255, 255, .14); border: 2px solid rgba(255, 255, 255, .45); border-radius: 0; user-select: none; -webkit-user-select: none; display: grid; place-items: center; min-height: 52px; }
  .k.on { background: rgba(255, 255, 255, .4); }
  .k.big { min-height: 64px; background: rgba(217, 77, 74, .35); }
  .up { grid-area: 1 / 2; } .lf { grid-area: 2 / 1; } .rt { grid-area: 2 / 3; } .dn { grid-area: 3 / 2; }
  .sys { position: absolute; top: 8px; right: 8px; display: none; gap: 6px; z-index: 10; }
  body.touch .sys { display: flex; }
  .sys .k { min-height: 34px; padding: 0 10px; }
</style>
</head>
<body>
<div id="dos"></div>
<div class="sys">
  <div class="k" data-key="256">ESC</div>
  <div class="k" data-key="89">Y</div>
  <div class="k" data-key="257">ENTER</div>
</div>
<div id="pad">
  <div class="grp dpad">
    <div class="k up" data-key="265">▲</div>
    <div class="k lf" data-key="263">◀</div>
    <div class="k rt" data-key="262">▶</div>
    <div class="k dn" data-key="264">▼</div>
  </div>
  <div class="grp acts">
    <div class="k" data-key="340">RUN</div>
    <div class="k" data-key="32">USE</div>
    <div class="k big" data-key="341" style="grid-column: span 2">FIRE</div>
  </div>
</div>
<script>
  // js-dos asks for a keyboard lock, which browsers only allow on top-level pages. Inside the window it isn't needed.
  if (window.top !== window && navigator.keyboard) navigator.keyboard.lock = () => Promise.resolve();
</script>
<script src="jsdos/js-dos.js"></script>
<script>
(() => {
  const game = (new URLSearchParams(location.search).get("g") || "").replace(/[^\w-]/g, "");
  const tell = (ev, extra) => { try { parent.postMessage({ type: "dos", game, ev, ...extra }, location.origin); } catch {} };
  let ci = null, props = null;
  if (matchMedia("(pointer: coarse)").matches) document.body.classList.add("touch");

  props = Dos(document.getElementById("dos"), {
    url: game + ".jsdos",
    pathPrefix: new URL("jsdos/emulators/", location.href).href,
    backend: "dosbox", backendLocked: true,
    kiosk: true, autoStart: true, noCloud: true, noNetworking: true,
    imageRendering: "pixelated", mouseCapture: false, volume: 0.6,
    onEvent: (ev, arg) => {
      if (ev === "ci-ready") { ci = arg; tell("ready"); }
      else if (ev === "bnd-play") tell("loading");
    },
  });

  // On-screen keys for phones. Each button holds its DOS key while pressed.
  for (const b of document.querySelectorAll("[data-key]")) {
    const code = +b.dataset.key;
    const set = (down) => (e) => { e.preventDefault(); b.classList.toggle("on", down); ci && ci.sendKeyEvent(code, down); };
    b.addEventListener("pointerdown", (e) => { b.setPointerCapture(e.pointerId); set(true)(e); });
    b.addEventListener("pointerup", set(false));
    b.addEventListener("pointercancel", set(false));
  }

  // The PixelOS window pauses the game while it is minimized.
  window.dosPause = (p) => { try { props && props.setPaused && props.setPaused(!!p); } catch {} };
  window.addEventListener("pointerdown", () => tell("focus"));
  window.dosCi = () => ci;
})();
</script>
</body>
</html>

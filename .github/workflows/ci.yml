name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node scripts/check-syntax.mjs
      - name: Film smoke
        run: node scripts/film-smoke.mjs
      - name: Unit tests
        run: node --test "scripts/test/*.test.mjs"
